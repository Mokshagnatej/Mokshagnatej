<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-rail-luxe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0414"/>
      <stop offset="100%" stop-color="#140822"/>
    </linearGradient>
    <linearGradient id="glow-rail-luxe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="bloom-rail" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .card-title { font-family: 'Space Grotesk', 'Outfit', 'Manrope', sans-serif; font-weight: 800; font-size: 20px; fill: #F8FAFC; }
      .card-desc { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', monospace; font-size: 11px; fill: #8BA4B8; }
      .card-chip { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; font-weight: bold; }
    </style>
  </defs>

  <rect width="580" height="240" rx="16" fill="url(#bg-rail-luxe)" stroke="url(#glow-rail-luxe)" stroke-width="1.6"/>
  
  <path d="M 14,32 L 14,14 L 32,14" fill="none" stroke="#C084FC" stroke-width="3"/>
  <path d="M 566,32 L 566,14 L 548,14" fill="none" stroke="#818CF8" stroke-width="3"/>

  <!-- Status Badge -->
  <g transform="translate(415, 20)">
    <rect x="0" y="0" width="145" height="24" rx="6" fill="#030712" stroke="#C084FC" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#C084FC" filter="url(#bloom-rail)"/>
    <text x="24" y="16" class="card-chip" fill="#C084FC">● UX REMASTERED</text>
  </g>

  <!-- 3D Bullet Train Icon Left -->
  <g transform="translate(32, 45)">
    <polygon points="10,0 45,0 55,40 2,40" fill="#C084FC" opacity="0.85" filter="url(#bloom-rail)"/>
    <polygon points="15,8 40,8 45,22 10,22" fill="#030712"/>
    <circle cx="15" cy="32" r="3.5" fill="#FFFFFF"/>
    <circle cx="42" cy="32" r="3.5" fill="#FFFFFF"/>
    <line x1="-5" y1="48" x2="60" y2="48" stroke="#818CF8" stroke-width="2"/>
  </g>

  <text x="98" y="60" class="card-title">RailYatra Next-Gen Transit HUD</text>
  <text x="32" y="105" class="card-desc">
    <tspan x="32" dy="0">&gt; Modern redesign of IRCTC &amp; Railway Booking.</tspan>
    <tspan x="32" dy="16">&gt; Instantaneous seat discovery &amp; streamlined UX.</tspan>
    <tspan x="32" dy="16">&gt; React UI · Frictionless Booking · Design System</tspan>
  </text>

  <!-- Tech Tags -->
  <g transform="translate(32, 162)">
    <rect x="0" y="0" width="85" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="42" y="16" text-anchor="middle" class="card-chip" fill="#38BDF8">REACT UI</text>

    <rect x="95" y="0" width="65" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="127" y="16" text-anchor="middle" class="card-chip" fill="#F472B6">UI/UX</text>

    <rect x="170" y="0" width="115" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="227" y="16" text-anchor="middle" class="card-chip" fill="#C084FC">DESIGN SYSTEM</text>
  </g>

  <!-- Launch Button -->
  <g transform="translate(385, 182)">
    <rect x="0" y="0" width="175" height="38" rx="8" fill="#C084FC" filter="url(#bloom-rail)"/>
    <text x="87" y="24" text-anchor="middle" font-family="'Space Grotesk', 'Outfit', sans-serif" font-size="12" font-weight="900" fill="#030712">VIEW REPOSITORY ➔</text>
  </g>
</svg>
