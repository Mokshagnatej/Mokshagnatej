<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-rail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0514"/>
      <stop offset="100%" stop-color="#1A0A26"/>
    </linearGradient>
    <linearGradient id="glow-rail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E100FF"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>
    <filter id="glow-rail-f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 20px; fill: #FFFFFF; }
      .card-desc { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; fill: #94A3B8; }
      .card-chip { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 10px; font-weight: bold; }
    </style>
  </defs>

  <rect width="580" height="240" rx="14" fill="url(#bg-rail)" stroke="url(#glow-rail)" stroke-width="1.6"/>
  
  <path d="M 12,30 L 12,12 L 30,12" fill="none" stroke="#E100FF" stroke-width="3"/>
  <path d="M 568,30 L 568,12 L 550,12" fill="none" stroke="#7F00FF" stroke-width="3"/>

  <!-- Status Badge -->
  <g transform="translate(420, 20)">
    <rect x="0" y="0" width="135" height="22" rx="6" fill="#000000" stroke="#E100FF" stroke-width="1"/>
    <circle cx="12" cy="11" r="3.5" fill="#E100FF"/>
    <text x="22" y="15" class="card-chip" fill="#E100FF">● UX REMASTERED</text>
  </g>

  <!-- 3D Bullet Train Icon Left -->
  <g transform="translate(30, 45)">
    <polygon points="10,0 45,0 55,40 2,40" fill="#E100FF" opacity="0.85" filter="url(#glow-rail-f)"/>
    <polygon points="15,8 40,8 45,22 10,22" fill="#04060C"/>
    <circle cx="15" cy="32" r="3.5" fill="#FFFFFF"/>
    <circle cx="42" cy="32" r="3.5" fill="#FFFFFF"/>
    <!-- Speed Rail Lines -->
    <line x1="-5" y1="48" x2="60" y2="48" stroke="#7F00FF" stroke-width="2"/>
  </g>

  <text x="95" y="60" class="card-title">RailYatra Next-Gen Transit HUD</text>
  <text x="30" y="105" class="card-desc">
    <tspan x="30" dy="0">&gt; Modern redesign of IRCTC &amp; Railway Booking.</tspan>
    <tspan x="30" dy="16">&gt; Instantaneous seat discovery &amp; streamlined UX.</tspan>
    <tspan x="30" dy="16">&gt; React UI · Frictionless Booking · Design System</tspan>
  </text>

  <!-- Tech Tags -->
  <g transform="translate(30, 160)">
    <rect x="0" y="0" width="75" height="22" rx="5" fill="#1E293B"/>
    <text x="37" y="15" text-anchor="middle" class="card-chip" fill="#61DAFB">REACT UI</text>

    <rect x="85" y="0" width="60" height="22" rx="5" fill="#1E293B"/>
    <text x="115" y="15" text-anchor="middle" class="card-chip" fill="#FF61F6">UI/UX</text>

    <rect x="155" y="0" width="105" height="22" rx="5" fill="#1E293B"/>
    <text x="207" y="15" text-anchor="middle" class="card-chip" fill="#7F00FF">DESIGN SYSTEM</text>
  </g>

  <!-- Launch Button -->
  <g transform="translate(390, 185)">
    <rect x="0" y="0" width="165" height="36" rx="8" fill="#E100FF" filter="url(#glow-rail-f)"/>
    <text x="82" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="900" fill="#04060C">VIEW REPOSITORY ➔</text>
  </g>
</svg>
