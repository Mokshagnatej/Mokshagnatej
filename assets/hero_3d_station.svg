<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Obsidian Base Gradient -->
    <linearGradient id="hero-obsidian-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <!-- Refined Linear Typography Gradient -->
    <linearGradient id="hero-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="75%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Subtle Border Stroke Gradient -->
    <linearGradient id="hero-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Subtle Ambient Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .font-display { font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace; }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.22; }
      }
      .ambient-glow { animation: pulseLight 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card Background Surface -->
  <rect width="1200" height="320" rx="16" fill="url(#hero-obsidian-bg)" stroke="url(#hero-border-grad)" stroke-width="1.2"/>

  <!-- Ambient Light Orbs -->
  <circle class="ambient-glow" cx="600" cy="140" r="220" fill="#38BDF8" opacity="0.12" filter="url(#soft-glow)"/>
  <circle class="ambient-glow" cx="200" cy="80" r="140" fill="#818CF8" opacity="0.08" filter="url(#soft-glow)"/>
  <circle class="ambient-glow" cx="1000" cy="240" r="160" fill="#10B981" opacity="0.06" filter="url(#soft-glow)"/>

  <!-- Subtle Precision Geometric Grid -->
  <g stroke="#1E293B" stroke-width="0.8" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="1100" y1="0" x2="1100" y2="320"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
  </g>

  <!-- Top Status Pill Badge -->
  <g transform="translate(600, 48)">
    <rect x="-210" y="-14" width="420" height="28" rx="14" fill="#111827" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="-185" cy="0" r="4" fill="#10B981"/>
    <text x="0" y="4" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1">
      CSE UNDERGRADUATE <tspan fill="#38BDF8">✦</tspan> FULL-STACK &amp; AI DEVELOPER
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="132" text-anchor="middle" class="font-display" font-size="46" font-weight="800" fill="url(#hero-title-grad)" letter-spacing="2">
    MOKSHAGNA TEJ KALEPALLI
  </text>

  <!-- Subtitle Tagline Pill -->
  <g transform="translate(600, 185)">
    <rect x="-370" y="-16" width="740" height="32" rx="8" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" class="font-mono" font-size="12.5" font-weight="500" fill="#F8FAFC" letter-spacing="0.8">
      Building scalable web systems <tspan fill="#38BDF8">·</tspan> Architecting AI pipelines <tspan fill="#818CF8">·</tspan> Crafting clean UX
    </text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(0, 288)" class="font-mono" font-size="11" fill="#64748B">
    <text x="50" y="0">🎓 VEL TECH UNIVERSITY [VTU29491]</text>
    <text x="600" y="0" text-anchor="middle">🏆 AI &amp; CLOUD SYSTEMS</text>
    <text x="1150" y="0" text-anchor="end">💼 EX-SDE INTERN @ INNOLIFT</text>
  </g>

  <!-- Subtle Corner Highlights -->
  <path d="M 12,28 L 12,12 L 28,12" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>
  <path d="M 1188,28 L 1188,12 L 1172,12" fill="none" stroke="#818CF8" stroke-width="2" opacity="0.6"/>
  <path d="M 12,292 L 12,308 L 28,308" fill="none" stroke="#1E293B" stroke-width="2"/>
  <path d="M 1188,292 L 1188,308 L 1172,308" fill="none" stroke="#1E293B" stroke-width="2"/>
</svg>
