<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Dark Luxe Cosmic Gradient Background -->
    <linearGradient id="station-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="40%" stop-color="#080E1E"/>
      <stop offset="85%" stop-color="#0E0824"/>
      <stop offset="100%" stop-color="#04060E"/>
    </linearGradient>

    <!-- Aurora Glow Text -->
    <linearGradient id="hero-grad-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#C084FC;#34D399;#38BDF8" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#C084FC;#34D399;#38BDF8;#818CF8" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#C084FC">
        <animate attributeName="stop-color" values="#C084FC;#34D399;#38BDF8;#818CF8;#C084FC" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Screen Glass Gradient -->
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>

    <!-- Isometric Desk Gradient -->
    <linearGradient id="desk-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="desk-side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glow Bloom Filter -->
    <filter id="bloom-luxe" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatStation {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatScreenLeft {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(-1deg); }
      }
      @keyframes floatScreenRight {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes blinkLed {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes steamFloat {
        0% { transform: translateY(0px) scale(0.8); opacity: 0.7; }
        100% { transform: translateY(-15px) scale(1.3); opacity: 0; }
      }
      .station-group { animation: floatStation 6s ease-in-out infinite; }
      .screen-left { animation: floatScreenLeft 5s ease-in-out infinite; }
      .screen-right { animation: floatScreenRight 5.5s ease-in-out infinite; }
      .led-blink { animation: blinkLed 1.2s ease-in-out infinite alternate; }
      .steam-p { animation: steamFloat 2s ease-out infinite; }
      .font-hero { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; font-weight: 900; }
      .font-mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, Menlo, monospace; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="440" rx="20" fill="url(#station-bg)"/>

  <!-- Soft Ambient Aurora Lighting Behind Setup -->
  <circle cx="280" cy="180" r="180" fill="#38BDF8" opacity="0.12" filter="url(#bloom-luxe)"/>
  <circle cx="920" cy="200" r="200" fill="#818CF8" opacity="0.14" filter="url(#bloom-luxe)"/>
  <circle cx="600" cy="160" r="240" fill="#C084FC" opacity="0.08" filter="url(#bloom-luxe)"/>

  <!-- 3D Perspective Floor Grid -->
  <g stroke="#38BDF8" opacity="0.12">
    <line x1="0" y1="320" x2="1200" y2="320" stroke-width="0.8"/>
    <line x1="0" y1="355" x2="1200" y2="355" stroke-width="1.2"/>
    <line x1="0" y1="395" x2="1200" y2="395" stroke-width="1.6"/>
    <line x1="0" y1="435" x2="1200" y2="435" stroke-width="2"/>

    <line x1="600" y1="280" x2="0" y2="440" stroke-width="1"/>
    <line x1="600" y1="280" x2="250" y2="440" stroke-width="1.2"/>
    <line x1="600" y1="280" x2="500" y2="440" stroke-width="1.4"/>
    <line x1="600" y1="280" x2="700" y2="440" stroke-width="1.4"/>
    <line x1="600" y1="280" x2="950" y2="440" stroke-width="1.2"/>
    <line x1="600" y1="280" x2="1200" y2="440" stroke-width="1"/>
  </g>

  <!-- ========================================================== -->
  <!-- 3D ISOMETRIC DEVELOPER WORKSTATION (HERO GRAPHIC) -->
  <!-- ========================================================== -->
  <g class="station-group" transform="translate(600, 240)">
    
    <!-- 3D Isometric Main Desk Surface -->
    <!-- Desk Top Plane -->
    <polygon points="0,-40 320,40 0,120 -320,40" fill="url(#desk-top)" stroke="#38BDF8" stroke-width="1" opacity="0.9"/>
    <!-- Desk Front Left Edge -->
    <polygon points="-320,40 0,120 0,140 -320,60" fill="url(#desk-side)"/>
    <!-- Desk Front Right Edge -->
    <polygon points="0,120 320,40 320,60 0,140" fill="#020617"/>

    <!-- Desk Legs / Pillars -->
    <polygon points="-280,55 -260,60 -260,170 -280,165" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <polygon points="280,55 260,60 260,170 280,165" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    
    <!-- Under-Desk Ambient LED Strip Glow -->
    <line x1="-310" y1="45" x2="0" y2="125" stroke="#38BDF8" stroke-width="4" filter="url(#bloom-luxe)" opacity="0.6"/>
    <line x1="0" y1="125" x2="310" y2="45" stroke="#C084FC" stroke-width="4" filter="url(#bloom-luxe)" opacity="0.6"/>

    <!-- 3D Isometric Screen Stand Left -->
    <polygon points="-120,0 -100,5 -100,20 -120,15" fill="#334155"/>
    <polygon points="-115,-30 -105,-25 -105,5 -115,0" fill="#475569"/>

    <!-- 3D Left Code Monitor (IDE Display) -->
    <g class="screen-left" transform="translate(-110, -50)">
      <!-- Monitor Frame -->
      <polygon points="-140,-90 0,-40 0,40 -140,-10" fill="#030712" stroke="#38BDF8" stroke-width="1.8" filter="url(#soft-glow)"/>
      <!-- Inner Screen -->
      <polygon points="-135,-85 -5,-38 -5,35 -135,-8" fill="url(#screen-grad)"/>
      
      <!-- IDE Header Bar -->
      <polygon points="-135,-85 -5,-38 -5,-25 -135,-72" fill="#0F172A"/>
      <circle cx="-125" cy="-77" r="2.5" fill="#F43F5E"/>
      <circle cx="-115" cy="-73" r="2.5" fill="#FBBF24"/>
      <circle cx="-105" cy="-69" r="2.5" fill="#34D399"/>
      
      <!-- Code Syntax Lines -->
      <line x1="-125" y1="-60" x2="-45" y2="-30" stroke="#38BDF8" stroke-width="2.5"/>
      <line x1="-120" y1="-46" x2="-60" y2="-24" stroke="#C084FC" stroke-width="2"/>
      <line x1="-120" y1="-32" x2="-30" y2="0" stroke="#34D399" stroke-width="2"/>
      <line x1="-115" y1="-18" x2="-55" y2="4" stroke="#FBBF24" stroke-width="2"/>
      <line x1="-125" y1="-4" x2="-70" y2="16" stroke="#38BDF8" stroke-width="2"/>
    </g>

    <!-- 3D Right Analytics Monitor (Telemetry & AI Graph Display) -->
    <g class="screen-right" transform="translate(110, -45)">
      <!-- Monitor Frame -->
      <polygon points="0,-40 140,-90 140,-10 0,40" fill="#030712" stroke="#C084FC" stroke-width="1.8" filter="url(#soft-glow)"/>
      <!-- Inner Screen -->
      <polygon points="5,-38 135,-85 135,-8 5,35" fill="url(#screen-grad)"/>
      
      <!-- Header Bar -->
      <polygon points="5,-38 135,-85 135,-72 5,-25" fill="#0F172A"/>
      <circle cx="20" cy="-30" r="2.5" fill="#38BDF8"/>
      <circle cx="30" cy="-34" r="2.5" fill="#818CF8"/>
      <circle cx="40" cy="-38" r="2.5" fill="#C084FC"/>

      <!-- 3D Telemetry Graph Bars -->
      <polygon points="20,10 32,5 32,-15 20,-10" fill="#38BDF8" opacity="0.8"/>
      <polygon points="40,2 52,-3 52,-30 40,-25" fill="#818CF8" opacity="0.85"/>
      <polygon points="60,-6 72,-11 72,-45 60,-40" fill="#C084FC" opacity="0.9"/>
      <polygon points="80,-14 92,-19 92,-35 80,-30" fill="#34D399" opacity="0.8"/>
      <polygon points="100,-22 112,-27 112,-55 100,-50" fill="#FBBF24" opacity="0.9"/>
      
      <!-- Glowing Real-Time Anomaly Wave Line -->
      <path d="M 15,20 Q 45,-10 70,-35 T 125,-45" fill="none" stroke="#34D399" stroke-width="2.5" filter="url(#soft-glow)"/>
    </g>

    <!-- 3D Center Keyboard & Trackpad -->
    <polygon points="-70,40 70,40 50,75 -90,75" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <!-- Key Grid Illusion -->
    <line x1="-60" y1="50" x2="60" y2="50" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>
    <line x1="-65" y1="58" x2="55" y2="58" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>
    <line x1="-75" y1="66" x2="45" y2="66" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>
    
    <!-- 3D Holographic Coffee Mug on Desk Right -->
    <g transform="translate(160, 50)">
      <ellipse cx="0" cy="0" rx="10" ry="5" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
      <polygon points="-10,0 10,0 8,18 -8,18" fill="#0F172A"/>
      <ellipse cx="0" cy="18" rx="8" ry="4" fill="#020617"/>
      <!-- Steaming Vapors -->
      <path class="steam-p" d="M -2,-5 Q 2,-12 -2,-18" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.8"/>
      <path class="steam-p" d="M 2,-5 Q -2,-12 2,-18" fill="none" stroke="#C084FC" stroke-width="1.5" opacity="0.8"/>
    </g>

    <!-- 3D Student Graduation Cap / Achievement Badge Left -->
    <g transform="translate(-180, 55)">
      <!-- Cap Base Diamond -->
      <polygon points="0,-12 22,-3 0,6 -22,-3" fill="#312E81" stroke="#818CF8" stroke-width="1.5" filter="url(#soft-glow)"/>
      <polygon points="-12,-2 12,-2 10,8 -10,8" fill="#1E1B4B"/>
      <!-- Gold Tassel -->
      <circle cx="0" cy="-3" r="2.5" fill="#FBBF24"/>
      <path d="M 0,-3 Q 12,2 14,14" fill="none" stroke="#FBBF24" stroke-width="1.8"/>
    </g>

    <!-- 3D Backend Cloud Server Tower Left -->
    <g transform="translate(-250, 0)">
      <!-- Server Tower Body -->
      <polygon points="-25,-50 15,-30 15,30 -25,10" fill="#090E1A" stroke="#38BDF8" stroke-width="1.5"/>
      <polygon points="15,-30 40,-40 40,20 15,30" fill="#030712"/>
      <polygon points="-25,-50 0,-60 40,-40 15,-30" fill="#1E293B"/>
      
      <!-- Blinking Status LEDs -->
      <circle class="led-blink" cx="-5" cy="-25" r="2.5" fill="#34D399" filter="url(#soft-glow)"/>
      <circle class="led-blink" cx="5" cy="-21" r="2.5" fill="#38BDF8" filter="url(#soft-glow)"/>
      <circle class="led-blink" cx="-5" cy="-5" r="2.5" fill="#34D399" filter="url(#soft-glow)"/>
      <circle class="led-blink" cx="5" cy="-1" r="2.5" fill="#C084FC" filter="url(#soft-glow)"/>
      <circle class="led-blink" cx="-5" cy="15" r="2.5" fill="#FBBF24" filter="url(#soft-glow)"/>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- HERO HEADER TYPOGRAPHY & STUDENT IDENTITY BADGE -->
  <!-- ========================================================== -->
  
  <!-- Outer Glass Frame -->
  <rect x="20" y="20" width="1160" height="400" rx="16" fill="none" stroke="#38BDF8" stroke-width="1.4" opacity="0.4"/>
  
  <!-- Corner Precision Brackets -->
  <path d="M 20,60 L 20,20 L 60,20" fill="none" stroke="#38BDF8" stroke-width="3.5" filter="url(#soft-glow)"/>
  <path d="M 1180,60 L 1180,20 L 1140,20" fill="none" stroke="#38BDF8" stroke-width="3.5" filter="url(#soft-glow)"/>
  <path d="M 20,380 L 20,420 L 60,420" fill="none" stroke="#34D399" stroke-width="3.5" filter="url(#soft-glow)"/>
  <path d="M 1180,380 L 1180,420 L 1140,420" fill="none" stroke="#C084FC" stroke-width="3.5" filter="url(#soft-glow)"/>

  <!-- Top Real-Time Status Pill -->
  <g transform="translate(600, 42)">
    <rect x="-240" y="-14" width="480" height="28" rx="14" fill="#040714" stroke="#38BDF8" stroke-width="1.2" filter="url(#soft-glow)"/>
    <circle cx="-215" cy="0" r="4" fill="#34D399" filter="url(#soft-glow)"/>
    <text x="0" y="4" text-anchor="middle" class="font-mono" font-size="11" font-weight="bold" fill="#38BDF8" letter-spacing="1">
      ● 3RD-YEAR CSE UNDERGRADUATE // FULL-STACK ENGINEER
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="105" text-anchor="middle" class="font-hero" font-size="44" fill="url(#hero-grad-text)" filter="url(#bloom-luxe)" opacity="0.6">
    MOKSHAGNA TEJ KALEPALLI
  </text>
  <text x="600" y="105" text-anchor="middle" class="font-hero" font-size="44" fill="url(#hero-grad-text)">
    MOKSHAGNA TEJ KALEPALLI
  </text>

  <!-- Role Subtitle Glass Capsule -->
  <g transform="translate(600, 145)">
    <rect x="-380" y="-18" width="760" height="36" rx="18" fill="#030712" stroke="#818CF8" stroke-width="1.4" opacity="0.9"/>
    <text x="0" y="5" text-anchor="middle" class="font-mono" font-size="12" font-weight="bold" fill="#F8FAFC" letter-spacing="1.5">
      FULL-STACK DEVELOPER (MERN) <tspan fill="#38BDF8">✦</tspan> CLOUD &amp; AI <tspan fill="#C084FC">✦</tspan> MICROSOFT IMAGINE CUP '26
    </text>
  </g>

  <!-- Bottom Coordinate Specs -->
  <g class="font-mono" font-size="11" fill="#94A3B8">
    <text x="45" y="405">ACADEMIC ORBIT: VEL TECH UNIVERSITY [VTU29491]</text>
    <text x="890" y="405">PRIMARY ARSENAL: REACT · NODE · JAVA · AZURE</text>
  </g>
</svg>
