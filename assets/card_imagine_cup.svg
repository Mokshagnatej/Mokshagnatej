<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-banner-luxe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="50%" stop-color="#0B1124"/>
      <stop offset="100%" stop-color="#120A24"/>
    </linearGradient>

    <linearGradient id="aurora-gold-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="azure-pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="openai-pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <filter id="luxe-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatTrophy {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-7px) scale(1.05); }
      }
      .trophy-group { animation: floatTrophy 4.5s ease-in-out infinite; transform-origin: 100px 100px; }
      .luxe-title { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-weight: 800; }
      .luxe-mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, Menlo, monospace; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="1200" height="200" rx="16" fill="url(#bg-banner-luxe)" stroke="url(#aurora-gold-cyan)" stroke-width="1.8"/>

  <!-- Subtle Corner Brackets -->
  <path d="M 16,42 L 16,16 L 42,16" fill="none" stroke="#F59E0B" stroke-width="3.5"/>
  <path d="M 1184,42 L 1184,16 L 1158,16" fill="none" stroke="#38BDF8" stroke-width="3.5"/>
  <path d="M 16,158 L 16,184 L 42,184" fill="none" stroke="#F59E0B" stroke-width="3.5"/>
  <path d="M 1184,158 L 1184,184 L 1158,184" fill="none" stroke="#C084FC" stroke-width="3.5"/>

  <!-- 3D Holographic Imagine Cup Trophy Left -->
  <g class="trophy-group" transform="translate(48, 28)">
    <ellipse cx="55" cy="130" rx="45" ry="12" fill="#F59E0B" opacity="0.25" filter="url(#luxe-bloom)"/>
    <polygon points="35,120 75,120 65,130 45,130" fill="#B45309"/>
    <polygon points="50,98 60,98 60,120 50,120" fill="#F59E0B"/>
    <path d="M 30,45 Q 55,95 80,45 Z" fill="#FBBF24" filter="url(#luxe-bloom)"/>
    <ellipse cx="55" cy="45" rx="25" ry="8" fill="#FEF08A"/>
    <path d="M 30,48 Q 14,62 33,74" fill="none" stroke="#F59E0B" stroke-width="3.5"/>
    <path d="M 80,48 Q 96,62 77,74" fill="none" stroke="#F59E0B" stroke-width="3.5"/>
    <circle cx="55" cy="62" r="4" fill="#FFFFFF" filter="url(#luxe-bloom)"/>
  </g>

  <!-- Title & Mission Text -->
  <g transform="translate(185, 42)">
    <!-- Status Tag -->
    <rect x="0" y="0" width="225" height="24" rx="6" fill="#030712" stroke="#F59E0B" stroke-width="1.2"/>
    <circle cx="12" cy="12" r="4" fill="#10B981" filter="url(#luxe-bloom)"/>
    <text x="24" y="16" class="luxe-mono" font-size="11" font-weight="bold" fill="#FBBF24" letter-spacing="1">GLOBAL HACKATHON '26</text>

    <!-- Main Title -->
    <text x="0" y="58" class="luxe-title" font-size="28" fill="#F8FAFC" letter-spacing="1">
      MICROSOFT IMAGINE CUP 2026
    </text>
    
    <!-- Subtitle / Architecture Statement -->
    <text x="0" y="88" class="luxe-mono" font-size="13" fill="#38BDF8">
      &gt; Architecting an end-to-end intelligent AI system powered by Azure Cloud &amp; OpenAI API.
    </text>
    <text x="0" y="108" class="luxe-mono" font-size="12" fill="#94A3B8">
      &gt; Focus: Real-time telemetry, automated diagnostic inference, and zero-latency pipelines.
    </text>
  </g>

  <!-- Right Pill Badges -->
  <g transform="translate(975, 48)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="165" height="40" rx="10" fill="url(#azure-pill-grad)" stroke="#38BDF8" stroke-width="1.5" filter="url(#luxe-bloom)"/>
      <text x="82" y="25" text-anchor="middle" class="luxe-title" font-size="13" fill="#FFFFFF">✦ AZURE CLOUD</text>
    </g>
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="165" height="40" rx="10" fill="url(#openai-pill-grad)" stroke="#34D399" stroke-width="1.5" filter="url(#luxe-bloom)"/>
      <text x="82" y="25" text-anchor="middle" class="luxe-title" font-size="13" fill="#FFFFFF">✦ OPENAI API</text>
    </g>
  </g>
</svg>
