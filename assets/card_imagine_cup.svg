<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-banner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0B0F24"/>
      <stop offset="100%" stop-color="#140A28"/>
    </linearGradient>

    <linearGradient id="glow-gold-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#E100FF"/>
    </linearGradient>

    <linearGradient id="azure-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#002050"/>
    </linearGradient>

    <linearGradient id="openai-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10A37F"/>
      <stop offset="100%" stop-color="#003D2E"/>
    </linearGradient>

    <filter id="card-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseTrophy {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-6px) scale(1.05); }
      }
      .trophy-3d { animation: pulseTrophy 4s ease-in-out infinite; transform-origin: 100px 100px; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; letter-spacing: 2px; }
      .mono-desc { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    </style>
  </defs>

  <!-- Background Frame -->
  <rect width="1200" height="200" rx="16" fill="url(#bg-banner)" stroke="url(#glow-gold-cyan)" stroke-width="1.8"/>

  <!-- Corner Brackets -->
  <path d="M 15,40 L 15,15 L 40,15" fill="none" stroke="#FFD700" stroke-width="3"/>
  <path d="M 1185,40 L 1185,15 L 1160,15" fill="none" stroke="#00F2FE" stroke-width="3"/>
  <path d="M 15,160 L 15,185 L 40,185" fill="none" stroke="#FFD700" stroke-width="3"/>
  <path d="M 1185,160 L 1185,185 L 1160,185" fill="none" stroke="#E100FF" stroke-width="3"/>

  <!-- 3D Holographic Trophy & Cloud Prism Left -->
  <g class="trophy-3d" transform="translate(45, 30)">
    <!-- 3D Glow Base -->
    <ellipse cx="60" cy="125" rx="45" ry="12" fill="#FFD700" opacity="0.2" filter="url(#card-bloom)"/>
    
    <!-- 3D Cup Base -->
    <polygon points="40,115 80,115 70,125 50,125" fill="#B38600"/>
    <polygon points="55,95 65,95 65,115 55,115" fill="#FFD700"/>
    
    <!-- 3D Cup Bowl -->
    <path d="M 35,45 Q 60,95 85,45 Z" fill="#FFD700" filter="url(#card-bloom)"/>
    <ellipse cx="60" cy="45" rx="25" ry="8" fill="#FFF275"/>
    
    <!-- Handles -->
    <path d="M 35,48 Q 20,60 38,72" fill="none" stroke="#FFD700" stroke-width="3.5"/>
    <path d="M 85,48 Q 100,60 82,72" fill="none" stroke="#FFD700" stroke-width="3.5"/>
    
    <!-- Central Star Sparkle -->
    <polygon points="60,52 63,60 71,60 65,65 67,73 60,68 53,73 55,65 49,60 57,60" fill="#FFFFFF"/>
  </g>

  <!-- Title & Mission Text -->
  <g transform="translate(190, 45)">
    <!-- Status Tag -->
    <rect x="0" y="0" width="220" height="24" rx="6" fill="#000000" stroke="#FFD700" stroke-width="1.2"/>
    <circle cx="12" cy="12" r="4" fill="#00FF87"/>
    <text x="24" y="16" class="mono-desc" font-size="11" font-weight="bold" fill="#FFD700">GLOBAL HACKATHON '26</text>

    <!-- Main Title -->
    <text x="0" y="55" class="header-title" font-size="28" fill="#FFFFFF">
      MICROSOFT IMAGINE CUP 2026
    </text>
    
    <!-- Subtitle / Architecture Statement -->
    <text x="0" y="85" class="mono-desc" font-size="13" fill="#00F2FE">
      &gt; Architecting an autonomous AI-driven solution end-to-end leveraging Azure Cloud &amp; OpenAI.
    </text>
    <text x="0" y="105" class="mono-desc" font-size="12" fill="#A0AEC0">
      &gt; Focus: High-throughput telemetry, real-time inference, and social-impact computing.
    </text>
  </g>

  <!-- Right Pill Badges -->
  <g transform="translate(980, 50)">
    <!-- Azure Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="38" rx="8" fill="url(#azure-blue)" stroke="#0078D4" stroke-width="1.5" filter="url(#card-bloom)"/>
      <text x="80" y="24" text-anchor="middle" class="header-title" font-size="13" fill="#FFFFFF">✦ AZURE CLOUD</text>
    </g>
    <!-- OpenAI Pill -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="160" height="38" rx="8" fill="url(#openai-teal)" stroke="#10A37F" stroke-width="1.5" filter="url(#card-bloom)"/>
      <text x="80" y="24" text-anchor="middle" class="header-title" font-size="13" fill="#FFFFFF">✦ OPENAI API</text>
    </g>
  </g>
</svg>
