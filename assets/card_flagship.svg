<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-flagship" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <style>
      .font-display { font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace; }
    </style>
  </defs>

  <rect width="1200" height="180" rx="14" fill="url(#bg-flagship)" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="0" y="0" width="1200" height="2" rx="1" fill="#38BDF8"/>

  <!-- Left Trophy Badge / Icon -->
  <g transform="translate(36, 40)">
    <rect width="60" height="60" rx="12" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="30" y="38" text-anchor="middle" font-size="26">⚡</text>
  </g>

  <!-- Title & Description (Center) -->
  <g transform="translate(120, 42)">
    <!-- Pill Tag -->
    <rect x="0" y="0" width="220" height="22" rx="4" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="110" y="15" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="700" fill="#38BDF8">FLAGSHIP ARCHITECTURE · 2026</text>

    <!-- Main Title -->
    <text x="0" y="48" class="font-display" font-size="24" font-weight="800" fill="#F8FAFC">
      AI Cloud Telemetry &amp; Anomaly Engine
    </text>

    <!-- Subtitle / Architecture -->
    <text x="0" y="74" class="font-mono" font-size="12" fill="#38BDF8">
      End-to-end intelligent AI anomaly telemetry system powered by Microsoft Azure Cloud &amp; OpenAI API.
    </text>
    <text x="0" y="94" class="font-mono" font-size="11" fill="#94A3B8">
      Automated root-cause diagnostics · Distributed stream ingestion · Real-time monitoring UI
    </text>
  </g>

  <!-- Right Pill Badges -->
  <g transform="translate(990, 48)">
    <rect x="0" y="0" width="165" height="34" rx="6" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="82" y="21" text-anchor="middle" class="font-display" font-size="11.5" font-weight="700" fill="#38BDF8">✦ AZURE CLOUD</text>

    <rect x="0" y="44" width="165" height="34" rx="6" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="82" y="65" text-anchor="middle" class="font-display" font-size="11.5" font-weight="700" fill="#10B981">✦ OPENAI API</text>
  </g>
</svg>
