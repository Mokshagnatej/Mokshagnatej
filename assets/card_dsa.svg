<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-dsa-luxe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030714"/>
      <stop offset="100%" stop-color="#0B1328"/>
    </linearGradient>
    <linearGradient id="glow-dsa-luxe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="bloom-dsa" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .card-title { font-family: 'Space Grotesk', 'Outfit', 'Manrope', sans-serif; font-weight: 800; font-size: 20px; fill: #F8FAFC; }
      .card-desc { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', monospace; font-size: 11px; fill: #8BA4B8; }
      .card-chip { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; font-weight: bold; }
    </style>
  </defs>

  <rect width="580" height="240" rx="16" fill="url(#bg-dsa-luxe)" stroke="url(#glow-dsa-luxe)" stroke-width="1.6"/>
  
  <path d="M 14,32 L 14,14 L 32,14" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <path d="M 566,32 L 566,14 L 548,14" fill="none" stroke="#38BDF8" stroke-width="3"/>

  <!-- Status Badge -->
  <g transform="translate(415, 20)">
    <rect x="0" y="0" width="145" height="24" rx="6" fill="#030712" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#F59E0B" filter="url(#bloom-dsa)"/>
    <text x="24" y="16" class="card-chip" fill="#FBBF24">● VERIFIED ALGO</text>
  </g>

  <!-- 3D Binary Tree / Graph Nodes Icon Left -->
  <g transform="translate(32, 45)">
    <circle cx="30" cy="5" r="7" fill="#F59E0B" filter="url(#bloom-dsa)"/>
    <line x1="30" y1="5" x2="10" y2="30" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="10" cy="30" r="6" fill="#38BDF8"/>
    <line x1="30" y1="5" x2="50" y2="30" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="50" cy="30" r="6" fill="#38BDF8"/>
    <line x1="10" y1="30" x2="2" y2="52" stroke="#C084FC" stroke-width="1.5"/>
    <circle cx="2" cy="52" r="4.5" fill="#C084FC"/>
  </g>

  <text x="98" y="60" class="card-title">Quantum DSA &amp; Testing Suite</text>
  <text x="32" y="105" class="card-desc">
    <tspan x="32" dy="0">&gt; Algorithmic problem-solving in Java, C, and C++.</tspan>
    <tspan x="32" dy="16">&gt; LeetCode &amp; HackerRank solutions with unit tests.</tspan>
    <tspan x="32" dy="16">&gt; Graph Theory · Dynamic Programming · Trees</tspan>
  </text>

  <!-- Tech Tags -->
  <g transform="translate(32, 162)">
    <rect x="0" y="0" width="60" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="30" y="16" text-anchor="middle" class="card-chip" fill="#FB923C">JAVA</text>

    <rect x="70" y="0" width="125" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="132" y="16" text-anchor="middle" class="card-chip" fill="#38BDF8">DATA STRUCTURES</text>

    <rect x="205" y="0" width="85" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="247" y="16" text-anchor="middle" class="card-chip" fill="#FBBF24">LEETCODE</text>
  </g>

  <!-- Launch Button -->
  <g transform="translate(385, 182)">
    <rect x="0" y="0" width="175" height="38" rx="8" fill="#F59E0B" filter="url(#bloom-dsa)"/>
    <text x="87" y="24" text-anchor="middle" font-family="'Space Grotesk', 'Outfit', sans-serif" font-size="12" font-weight="900" fill="#030712">VIEW REPOSITORY ➔</text>
  </g>
</svg>
