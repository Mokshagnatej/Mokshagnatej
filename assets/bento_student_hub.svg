<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <linearGradient id="hub-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <style>
      .font-display { font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace; }
      .hub-title { font-weight: 700; font-size: 15px; fill: #F8FAFC; }
      .hub-sub { font-size: 11px; fill: #94A3B8; }
      .hub-tag { font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="220" rx="14" fill="url(#hub-bg)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Quadrant 1: Academic Orbit / Vel Tech -->
  <g transform="translate(24, 20)">
    <rect width="270" height="180" rx="10" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <rect x="0" y="0" width="270" height="2" rx="1" fill="#38BDF8"/>
    
    <text x="18" y="32" class="font-display hub-title">Vel Tech University</text>
    <text x="18" y="50" class="font-mono hub-sub">3rd-Year CSE · B.Tech (2023–27)</text>
    
    <line x1="18" y1="65" x2="252" y2="65" stroke="#1E293B" stroke-width="1"/>
    
    <text x="18" y="88" class="font-mono hub-sub">Student ID: <tspan fill="#38BDF8" font-weight="600">VTU29491</tspan></text>
    <text x="18" y="108" class="font-mono hub-sub">Core: <tspan fill="#F8FAFC">MERN · Cloud · DSA</tspan></text>
    <text x="18" y="128" class="font-mono hub-sub">Status: <tspan fill="#10B981">● Active Undergraduate</tspan></text>
    
    <rect x="18" y="142" width="105" height="22" rx="4" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
    <text x="70" y="157" text-anchor="middle" class="font-mono hub-tag" fill="#38BDF8">CSE 2023–27</text>
  </g>

  <!-- Quadrant 2: Production Internship -->
  <g transform="translate(314, 20)">
    <rect width="270" height="180" rx="10" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <rect x="0" y="0" width="270" height="2" rx="1" fill="#818CF8"/>
    
    <text x="18" y="32" class="font-display hub-title">Innolift Ventures</text>
    <text x="18" y="50" class="font-mono hub-sub">Software Development Intern</text>
    
    <line x1="18" y1="65" x2="252" y2="65" stroke="#1E293B" stroke-width="1"/>
    
    <text x="18" y="88" class="font-mono hub-sub">Track: <tspan fill="#818CF8" font-weight="600">Track-3 Engineering</tspan></text>
    <text x="18" y="108" class="font-mono hub-sub">Deliverable: <tspan fill="#F8FAFC">Production Code &amp; ML</tspan></text>
    <text x="18" y="128" class="font-mono hub-sub">Focus: <tspan fill="#10B981">● Backend Pipelines</tspan></text>
    
    <rect x="18" y="142" width="130" height="22" rx="4" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
    <text x="83" y="157" text-anchor="middle" class="font-mono hub-tag" fill="#818CF8">SDE INTERNSHIP</text>
  </g>

  <!-- Quadrant 3: Creative & Editorial Direction -->
  <g transform="translate(604, 20)">
    <rect width="270" height="180" rx="10" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <rect x="0" y="0" width="270" height="2" rx="1" fill="#A78BFA"/>
    
    <text x="18" y="32" class="font-display hub-title">VTU Chronicle</text>
    <text x="18" y="50" class="font-mono hub-sub">Editorial &amp; Layout Lead</text>
    
    <line x1="18" y1="65" x2="252" y2="65" stroke="#1E293B" stroke-width="1"/>
    
    <text x="18" y="88" class="font-mono hub-sub">Domain: <tspan fill="#A78BFA" font-weight="600">Magazine &amp; UI Design</tspan></text>
    <text x="18" y="108" class="font-mono hub-sub">Craft: <tspan fill="#F8FAFC">Visual Systems &amp; Layouts</tspan></text>
    <text x="18" y="128" class="font-mono hub-sub">Tools: <tspan fill="#38BDF8">Figma · Adobe XD</tspan></text>
    
    <rect x="18" y="142" width="115" height="22" rx="4" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
    <text x="75" y="157" text-anchor="middle" class="font-mono hub-tag" fill="#A78BFA">CREATIVE LEAD</text>
  </g>

  <!-- Quadrant 4: Cloud & AI Systems Architecture -->
  <g transform="translate(894, 20)">
    <rect width="282" height="180" rx="10" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <rect x="0" y="0" width="282" height="2" rx="1" fill="#38BDF8"/>
    
    <text x="18" y="32" class="font-display hub-title">Cloud &amp; AI Systems</text>
    <text x="18" y="50" class="font-mono hub-sub">Intelligent Telemetry &amp; Infra</text>
    
    <line x1="18" y1="65" x2="264" y2="65" stroke="#1E293B" stroke-width="1"/>
    
    <text x="18" y="88" class="font-mono hub-sub">Platform: <tspan fill="#38BDF8" font-weight="600">Azure Cloud + OpenAI</tspan></text>
    <text x="18" y="108" class="font-mono hub-sub">Mission: <tspan fill="#F8FAFC">Real-Time AI Anomaly</tspan></text>
    <text x="18" y="128" class="font-mono hub-sub">Role: <tspan fill="#10B981">● Systems Architect</tspan></text>
    
    <rect x="18" y="142" width="135" height="22" rx="4" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
    <text x="85" y="157" text-anchor="middle" class="font-mono hub-tag" fill="#38BDF8">SYSTEMS ARCHITECT</text>
  </g>
</svg>
