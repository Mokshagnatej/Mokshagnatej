<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cw-luxe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0A1226"/>
    </linearGradient>
    <linearGradient id="glow-cw-luxe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="bloom-cw" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .card-title { font-family: 'Space Grotesk', 'Outfit', 'Manrope', sans-serif; font-weight: 800; font-size: 20px; fill: #F8FAFC; }
      .card-desc { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', monospace; font-size: 11px; fill: #8BA4B8; }
      .card-chip { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; font-weight: bold; }
    </style>
  </defs>

  <rect width="580" height="240" rx="16" fill="url(#bg-cw-luxe)" stroke="url(#glow-cw-luxe)" stroke-width="1.6"/>
  
  <path d="M 14,32 L 14,14 L 32,14" fill="none" stroke="#38BDF8" stroke-width="3"/>
  <path d="M 566,32 L 566,14 L 548,14" fill="none" stroke="#818CF8" stroke-width="3"/>
  
  <!-- Status Badge -->
  <g transform="translate(415, 20)">
    <rect x="0" y="0" width="145" height="24" rx="6" fill="#030712" stroke="#34D399" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#34D399" filter="url(#bloom-cw)"/>
    <text x="24" y="16" class="card-chip" fill="#34D399">● AI MONITORING</text>
  </g>

  <!-- 3D Isometric Server & Anomaly Pulse Icon -->
  <g transform="translate(32, 45)">
    <polygon points="25,5 50,20 25,35 0,20" fill="#38BDF8" opacity="0.9" filter="url(#bloom-cw)"/>
    <polygon points="0,20 25,35 25,55 0,40" fill="#0369A1"/>
    <polygon points="25,35 50,20 50,40 25,55" fill="#0284C7"/>
    <ellipse cx="25" cy="65" rx="30" ry="10" fill="none" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="25" cy="20" r="3.5" fill="#FFFFFF" filter="url(#bloom-cw)"/>
  </g>

  <text x="98" y="60" class="card-title">Cloudwatch Server Anomaly</text>
  <text x="32" y="105" class="card-desc">
    <tspan x="32" dy="0">&gt; Full-stack real-time anomaly prediction system.</tspan>
    <tspan x="32" dy="16">&gt; Flags metric deviations &amp; server latency surges.</tspan>
    <tspan x="32" dy="16">&gt; Flask Backend · React UI · ML Anomaly Core</tspan>
  </text>

  <!-- Tech Tags -->
  <g transform="translate(32, 162)">
    <rect x="0" y="0" width="65" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="32" y="16" text-anchor="middle" class="card-chip" fill="#38BDF8">FLASK</text>

    <rect x="75" y="0" width="65" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="107" y="16" text-anchor="middle" class="card-chip" fill="#61DAFB">REACT</text>

    <rect x="150" y="0" width="95" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="197" y="16" text-anchor="middle" class="card-chip" fill="#C084FC">ML ENGINE</text>
  </g>

  <!-- Launch Button -->
  <g transform="translate(385, 182)">
    <rect x="0" y="0" width="175" height="38" rx="8" fill="#38BDF8" filter="url(#bloom-cw)"/>
    <text x="87" y="24" text-anchor="middle" font-family="'Space Grotesk', 'Outfit', sans-serif" font-size="12" font-weight="900" fill="#030712">VIEW REPOSITORY ➔</text>
  </g>
</svg>
