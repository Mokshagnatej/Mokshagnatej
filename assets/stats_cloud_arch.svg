<svg width="495" height="220" viewBox="0 0 495 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020A0F"/>
      <stop offset="100%" stop-color="#0B1520"/>
    </linearGradient>
    <filter id="glowPurpleArch" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#C084FC" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="493" height="218" rx="14" fill="url(#bgGradArch)" stroke="#1A2E3B" stroke-width="1.5"/>
  <rect x="20" y="2" width="140" height="2.5" rx="1" fill="#C084FC" filter="url(#glowPurpleArch)"/>

  <path d="M 10,22 L 10,10 L 22,10" fill="none" stroke="#C084FC" stroke-width="2.5"/>
  <path d="M 485,22 L 485,10 L 473,10" fill="none" stroke="#38BDF8" stroke-width="2.5"/>

  <!-- Header -->
  <g transform="translate(24, 28)">
    <circle cx="6" cy="6" r="4.5" fill="#C084FC" filter="url(#glowPurpleArch)"/>
    <text x="18" y="10" font-family="'Space Grotesk', 'Outfit', 'Manrope', sans-serif" font-size="13" font-weight="700" fill="#C084FC" letter-spacing="1.2">CLOUD &amp; AI ARCHITECTURE MATRIX</text>
    <text x="445" y="10" text-anchor="end" font-family="'Space Grotesk', 'Outfit', 'Manrope', sans-serif" font-size="10" font-weight="600" fill="#38BDF8">IMAGINE CUP '26</text>
  </g>

  <!-- Architecture Spec Grid -->
  <g transform="translate(24, 50)">
    <!-- Column 1: Core Stack -->
    <rect x="0" y="0" width="215" height="128" rx="10" fill="#0B1520" stroke="#1A2E3B" stroke-width="1"/>
    <rect x="2" y="0" width="211" height="2" rx="1" fill="#38BDF8" opacity="0.6"/>
    <text x="14" y="22" font-family="'Space Grotesk', 'Outfit', 'Manrope', sans-serif" font-size="9" font-weight="700" fill="#38BDF8" letter-spacing="0.8">FULL-STACK &amp; CLOUD STACK</text>

    <g transform="translate(14, 36)">
      <!-- 3D diamond bullets -->
      <polygon points="4,0 8,4 4,8 0,4" fill="#38BDF8"/>
      <text x="16" y="7" font-family="'Space Grotesk', 'Outfit', 'Manrope', sans-serif" font-size="10.5" font-weight="600" fill="#F8FAFC">MERN Stack Architecture</text>

      <polygon points="4,22 8,26 4,30 0,26" fill="#C084FC"/>
      <text x="16" y="29" font-family="'Space Grotesk', 'Outfit', 'Manrope', sans-serif" font-size="10.5" font-weight="600" fill="#F8FAFC">Microsoft Azure &amp; OpenAI</text>

      <polygon points="4,44 8,48 4,52 0,48" fill="#34D399"/>
      <text x="16" y="51" font-family="'Space Grotesk', 'Outfit', 'Manrope', sans-serif" font-size="10.5" font-weight="600" fill="#F8FAFC">Docker &amp; Microservices</text>

      <polygon points="4,66 8,70 4,74 0,70" fill="#FBBF24"/>
      <text x="16" y="73" font-family="'Space Grotesk', 'Outfit', 'Manrope', sans-serif" font-size="10.5" font-weight="600" fill="#F8FAFC">Flask &amp; RESTful APIs</text>
    </g>

    <!-- Column 2: Mission & Metrics -->
    <rect x="230" y="0" width="217" height="128" rx="10" fill="#0B1520" stroke="#1A2E3B" stroke-width="1"/>
    <rect x="232" y="0" width="213" height="2" rx="1" fill="#C084FC" opacity="0.6"/>
    <text x="244" y="22" font-family="'Space Grotesk', 'Outfit', 'Manrope', sans-serif" font-size="9" font-weight="700" fill="#C084FC" letter-spacing="0.8">SYSTEM SPECIALIZATION</text>

    <g transform="translate(244, 36)">
      <text x="0" y="10" font-family="'Space Grotesk', 'Outfit', 'Manrope', sans-serif" font-size="9" font-weight="600" fill="#8BA4B8" letter-spacing="0.5">FOCUS AREA</text>
      <text x="0" y="26" font-family="'Space Grotesk', 'Outfit', 'Manrope', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">AI Anomaly &amp; Cloud Telemetry</text>

      <text x="0" y="52" font-family="'Space Grotesk', 'Outfit', 'Manrope', sans-serif" font-size="9" font-weight="600" fill="#8BA4B8" letter-spacing="0.5">ENGINEERING GOAL</text>
      <text x="0" y="68" font-family="'Space Grotesk', 'Outfit', 'Manrope', sans-serif" font-size="11" font-weight="700" fill="#34D399">High Uptime &amp; Zero Latency</text>
    </g>
  </g>

  <!-- Footer Tag -->
  <text x="24" y="205" font-family="'Space Grotesk', 'Outfit', 'Manrope', sans-serif" font-size="9" font-weight="500" fill="#5E7A8A">Target: Microsoft Imagine Cup '26 • Scalable Distributed Systems</text>
</svg>