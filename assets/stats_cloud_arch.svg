<svg width="495" height="210" viewBox="0 0 495 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="glowPurpleArch" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#C084FC" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="1.5" y="1.5" width="492" height="207" rx="14" fill="url(#bgGradArch)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="20" y="2" width="120" height="2" rx="1" fill="#C084FC" filter="url(#glowPurpleArch)"/>

  <!-- Header -->
  <g transform="translate(24, 28)">
    <circle cx="6" cy="6" r="4" fill="#C084FC" filter="url(#glowPurpleArch)"/>
    <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="13" font-weight="700" fill="#C084FC" letter-spacing="1.2">CLOUD &amp; AI ARCHITECTURE MATRIX</text>
    <text x="445" y="10" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="10" font-weight="600" fill="#38BDF8">IMAGINE CUP '26</text>
  </g>

  <!-- Architecture Spec Grid -->
  <g transform="translate(24, 52)">
    <!-- Column 1: Core Stack -->
    <rect x="0" y="0" width="215" height="124" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
    <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" letter-spacing="0.5">FULL-STACK &amp; CLOUD STACK</text>
    
    <g transform="translate(14, 34)">
      <circle cx="4" cy="6" r="3" fill="#38BDF8"/>
      <text x="14" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#F8FAFC">MERN Stack Architecture</text>
      
      <circle cx="4" cy="28" r="3" fill="#C084FC"/>
      <text x="14" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#F8FAFC">Microsoft Azure &amp; OpenAI</text>

      <circle cx="4" cy="50" r="3" fill="#34D399"/>
      <text x="14" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#F8FAFC">Docker &amp; Microservices</text>

      <circle cx="4" cy="72" r="3" fill="#FBBF24"/>
      <text x="14" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#F8FAFC">Flask &amp; RESTful APIs</text>
    </g>

    <!-- Column 2: Mission & Metrics -->
    <rect x="230" y="0" width="217" height="124" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
    <text x="244" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#C084FC" letter-spacing="0.5">SYSTEM SPECIALIZATION</text>

    <g transform="translate(244, 34)">
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">FOCUS AREA</text>
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">AI Anomaly &amp; Cloud Telemetry</text>

      <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">ENGINEERING GOAL</text>
      <text x="0" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34D399">High Uptime &amp; Zero Latency</text>
    </g>
  </g>

  <!-- Footer Tag -->
  <text x="24" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#64748B">Target: Microsoft Imagine Cup '26 • Scalable Distributed Systems</text>
</svg>