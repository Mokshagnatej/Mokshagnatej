<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="100%" height="130">
  <defs>
    <linearGradient id="footer-luxe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020A0F"/>
      <stop offset="100%" stop-color="#0A0E18"/>
    </linearGradient>

    <linearGradient id="footer-wave-luxe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#C084FC;#34D399;#38BDF8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#38BDF8;#C084FC;#818CF8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#34D399">
        <animate attributeName="stop-color" values="#34D399;#818CF8;#38BDF8;#34D399" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="foot-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .foot-head { font-family: 'Space Grotesk', 'Outfit', 'Manrope', sans-serif; font-weight: 700; letter-spacing: 2px; }
      .foot-sub { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', monospace; }
    </style>
  </defs>

  <rect width="1200" height="130" rx="14" fill="url(#footer-luxe-bg)"/>

  <!-- Top Laser Stroke -->
  <line x1="0" y1="2" x2="1200" y2="2" stroke="url(#footer-wave-luxe)" stroke-width="3" filter="url(#foot-bloom)"/>

  <!-- Subtle Matrix Columns -->
  <g stroke="#38BDF8" stroke-width="0.5" opacity="0.12">
    <line x1="200" y1="0" x2="200" y2="130"/>
    <line x1="400" y1="0" x2="400" y2="130"/>
    <line x1="600" y1="0" x2="600" y2="130"/>
    <line x1="800" y1="0" x2="800" y2="130"/>
    <line x1="1000" y1="0" x2="1000" y2="130"/>
  </g>

  <!-- Message -->
  <text x="600" y="58" text-anchor="middle" class="foot-head" font-size="15" fill="#F8FAFC">
    DESIGNED &amp; BROADCASTED WITH COSMIC PRECISION ✦ 2026
  </text>
  
  <text x="600" y="88" text-anchor="middle" class="foot-sub" font-size="12" fill="#38BDF8" opacity="0.9">
    [ SYSTEM NOMINAL // ALWAYS OPEN FOR HIGH-IMPACT COLLABORATIONS ]
  </text>

  <circle cx="260" cy="55" r="3" fill="#38BDF8" filter="url(#foot-bloom)"/>
  <circle cx="940" cy="55" r="3" fill="#C084FC" filter="url(#foot-bloom)"/>
</svg>
