<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="100%" height="36">
  <defs>
    <linearGradient id="luxe-div" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="1"/>
      <stop offset="75%" stop-color="#34D399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <filter id="div-bloom" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <line x1="80" y1="18" x2="1120" y2="18" stroke="url(#luxe-div)" stroke-width="2" filter="url(#div-bloom)"/>

  <!-- Center Jewel Node -->
  <g transform="translate(600, 18)">
    <polygon points="0,-9 9,0 0,9 -9,0" fill="#040714" stroke="#38BDF8" stroke-width="2" filter="url(#div-bloom)"/>
    <circle cx="0" cy="0" r="3" fill="#C084FC"/>
  </g>

  <!-- Side Accent Beacons -->
  <circle cx="550" cy="18" r="2.5" fill="#38BDF8" opacity="0.8"/>
  <circle cx="520" cy="18" r="1.5" fill="#38BDF8" opacity="0.4"/>
  <circle cx="650" cy="18" r="2.5" fill="#34D399" opacity="0.8"/>
  <circle cx="680" cy="18" r="1.5" fill="#34D399" opacity="0.4"/>
</svg>
