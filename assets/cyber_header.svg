<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="clean-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#080E1E"/>
      <stop offset="100%" stop-color="#0A0618"/>
    </linearGradient>

    <linearGradient id="clean-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#C084FC;#34D399;#38BDF8" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#C084FC;#34D399;#38BDF8;#818CF8" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#C084FC">
        <animate attributeName="stop-color" values="#C084FC;#34D399;#38BDF8;#818CF8;#C084FC" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="clean-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.6"/>
    </linearGradient>

    <!-- 3D Prism Gradients -->
    <linearGradient id="prism-top-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="prism-left-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="prism-right-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <filter id="clean-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatPrism {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(6deg); }
      }
      .float-prism { animation: floatPrism 6s ease-in-out infinite; transform-origin: center; }
      .clean-title { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; font-weight: 900; letter-spacing: 4px; }
      .clean-sub { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, Menlo, monospace; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="240" rx="16" fill="url(#clean-bg)" stroke="url(#clean-border)" stroke-width="1.5"/>

  <!-- Soft Ambient Glows -->
  <circle cx="250" cy="120" r="140" fill="#38BDF8" opacity="0.1" filter="url(#clean-bloom)"/>
  <circle cx="950" cy="120" r="140" fill="#818CF8" opacity="0.1" filter="url(#clean-bloom)"/>

  <!-- 3D Isometric Crystal Left -->
  <g class="float-prism" transform="translate(100, 110)">
    <polygon points="0,-32 28,-48 56,-32 28,-16" fill="url(#prism-top-c)" filter="url(#clean-bloom)"/>
    <polygon points="0,-32 28,-16 28,18 0,2" fill="url(#prism-left-c)"/>
    <polygon points="28,-16 56,-32 56,2 28,18" fill="url(#prism-right-c)"/>
    <circle cx="28" cy="-16" r="2.5" fill="#FFFFFF"/>
    <polygon points="0,-32 28,-48 56,-32 56,2 28,18 0,2" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- 3D Isometric Crystal Right -->
  <g class="float-prism" transform="translate(1040, 110)">
    <polygon points="0,-32 28,-48 56,-32 28,-16" fill="url(#prism-top-c)" filter="url(#clean-bloom)"/>
    <polygon points="0,-32 28,-16 28,18 0,2" fill="url(#prism-left-c)"/>
    <polygon points="28,-16 56,-32 56,2 28,18" fill="url(#prism-right-c)"/>
    <circle cx="28" cy="-16" r="2.5" fill="#FFFFFF"/>
    <polygon points="0,-32 28,-48 56,-32 56,2 28,18 0,2" fill="none" stroke="#C084FC" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Top Real-Time Status Pill -->
  <g transform="translate(600, 42)">
    <rect x="-210" y="-12" width="420" height="24" rx="12" fill="#060C1B" stroke="#38BDF8" stroke-width="1"/>
    <circle cx="-190" cy="0" r="3.5" fill="#34D399"/>
    <text x="0" y="4" text-anchor="middle" class="clean-sub" font-size="10.5" font-weight="bold" fill="#38BDF8" letter-spacing="1">
      ● FULL-STACK DEVELOPER &amp; CSE UNDERGRADUATE
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="112" text-anchor="middle" class="clean-title" font-size="44" fill="url(#clean-text-grad)" filter="url(#clean-bloom)" opacity="0.5">
    MOKSHAGNA TEJ
  </text>
  <text x="600" y="112" text-anchor="middle" class="clean-title" font-size="44" fill="url(#clean-text-grad)">
    MOKSHAGNA TEJ
  </text>

  <!-- Subtitle Glass Pill -->
  <g transform="translate(600, 165)">
    <rect x="-350" y="-16" width="700" height="32" rx="16" fill="#040714" stroke="url(#clean-border)" stroke-width="1.2"/>
    <text x="0" y="5" text-anchor="middle" class="clean-sub" font-size="12" font-weight="bold" fill="#F8FAFC" letter-spacing="1.2">
      MERN STACK <tspan fill="#38BDF8">✦</tspan> CLOUD &amp; AI <tspan fill="#C084FC">✦</tspan> VEL TECH CSE '27 <tspan fill="#34D399">✦</tspan> IMAGINE CUP '26
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="300" y1="210" x2="900" y2="210" stroke="url(#clean-border)" stroke-width="2" filter="url(#clean-bloom)"/>
</svg>
