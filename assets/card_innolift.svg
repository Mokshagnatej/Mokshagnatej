<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-inno" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <style>
      .font-display { font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', Menlo, monospace; }
      .card-title { font-weight: 700; font-size: 18px; fill: #F8FAFC; }
      .card-desc { font-size: 11px; fill: #94A3B8; }
      .card-chip { font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <rect width="580" height="220" rx="12" fill="url(#bg-inno)" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="0" y="0" width="580" height="2" rx="1" fill="#A78BFA"/>
  
  <!-- Status Badge -->
  <g transform="translate(425, 20)">
    <rect x="0" y="0" width="130" height="22" rx="4" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <circle cx="10" cy="11" r="3" fill="#A78BFA"/>
    <text x="20" y="15" class="font-mono card-chip" fill="#A78BFA">DA & ML INTERN</text>
  </g>

  <!-- Title & Description -->
  <text x="24" y="42" class="font-display card-title">Innolift Ventures ML Track</text>
  <text x="24" y="78" class="font-mono card-desc">
    <tspan x="24" dy="0">• Server anomaly detection — 98.6% accuracy (Random Forest).</tspan>
    <tspan x="24" dy="18">• Benchmarked 4 ML models — up to 98.9% test accuracy.</tspan>
    <tspan x="24" dy="18">• Python · Jupyter/Colab · Data Leakage Diagnosis</tspan>
  </text>

  <!-- Tech Tags -->
  <g transform="translate(24, 156)">
    <rect x="0" y="0" width="70" height="24" rx="4" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="35" y="16" text-anchor="middle" class="font-mono card-chip" fill="#38BDF8">PYTHON</text>

    <rect x="78" y="0" width="95" height="24" rx="4" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="125" y="16" text-anchor="middle" class="font-mono card-chip" fill="#10B981">ML PIPELINES</text>

    <rect x="181" y="0" width="95" height="24" rx="4" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    <text x="228" y="16" text-anchor="middle" class="font-mono card-chip" fill="#A78BFA">DATA MODEL</text>
  </g>

  <!-- View Repo Link -->
  <g transform="translate(425, 156)">
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#A78BFA"/>
    <text x="65" y="16" text-anchor="middle" class="font-display" font-size="10.5" font-weight="700" fill="#0B0F19">VIEW REPO ➔</text>
  </g>
</svg>
