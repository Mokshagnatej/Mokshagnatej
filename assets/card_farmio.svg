<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-farm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C0A"/>
      <stop offset="100%" stop-color="#081A14"/>
    </linearGradient>
    <linearGradient id="glow-farm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>
    <filter id="glow-farm-f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 20px; fill: #FFFFFF; }
      .card-desc { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; fill: #94A3B8; }
      .card-chip { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 10px; font-weight: bold; }
    </style>
  </defs>

  <rect width="580" height="240" rx="14" fill="url(#bg-farm)" stroke="url(#glow-farm)" stroke-width="1.6"/>
  
  <path d="M 12,30 L 12,12 L 30,12" fill="none" stroke="#00FF87" stroke-width="3"/>
  <path d="M 568,30 L 568,12 L 550,12" fill="none" stroke="#00D9FF" stroke-width="3"/>

  <!-- Status Badge -->
  <g transform="translate(420, 20)">
    <rect x="0" y="0" width="135" height="22" rx="6" fill="#000000" stroke="#00FF87" stroke-width="1"/>
    <circle cx="12" cy="11" r="3.5" fill="#00FF87"/>
    <text x="22" y="15" class="card-chip" fill="#00FF87">● AGRO INNOVATION</text>
  </g>

  <!-- 3D Isometric Sprout / Field Icon Left -->
  <g transform="translate(30, 45)">
    <!-- 3D Field Grid Base -->
    <polygon points="25,5 50,20 25,35 0,20" fill="#00FF87" opacity="0.85"/>
    <polygon points="0,20 25,35 25,55 0,40" fill="#007744"/>
    <polygon points="25,35 50,20 50,40 25,55" fill="#00AA66"/>
    <!-- Center Leaf Sprout -->
    <path d="M 25,25 Q 35,5 25,-10 Q 15,5 25,25 Z" fill="#00FF87" filter="url(#glow-farm-f)"/>
  </g>

  <text x="95" y="60" class="card-title">FarmIO Autonomous Agro-Deck</text>
  <text x="30" y="105" class="card-desc">
    <tspan x="30" dy="0">&gt; Precision organic agriculture platform.</tspan>
    <tspan x="30" dy="16">&gt; Telemetry-driven soil analysis &amp; crop optimization.</tspan>
    <tspan x="30" dy="16">&gt; Full-Stack JS · IoT Sensors · Data Visualizer</tspan>
  </text>

  <!-- Tech Tags -->
  <g transform="translate(30, 160)">
    <rect x="0" y="0" width="90" height="22" rx="5" fill="#1E293B"/>
    <text x="45" y="15" text-anchor="middle" class="card-chip" fill="#F7DF1E">JAVASCRIPT</text>

    <rect x="100" y="0" width="85" height="22" rx="5" fill="#1E293B"/>
    <text x="142" y="15" text-anchor="middle" class="card-chip" fill="#00D9FF">FULL-STACK</text>

    <rect x="195" y="0" width="80" height="22" rx="5" fill="#1E293B"/>
    <text x="235" y="15" text-anchor="middle" class="card-chip" fill="#00FF87">AGRO-TECH</text>
  </g>

  <!-- Launch Button -->
  <g transform="translate(390, 185)">
    <rect x="0" y="0" width="165" height="36" rx="8" fill="#00FF87" filter="url(#glow-farm-f)"/>
    <text x="82" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="900" fill="#04060C">VIEW REPOSITORY ➔</text>
  </g>
</svg>
